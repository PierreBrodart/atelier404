# Construit l'image Docker sur GitHub (et non sur le serveur, où `next build` manque de mémoire),
# la pousse sur GHCR, puis demande à Dokploy de redéployer : Dokploy ne fait que télécharger l'image.
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   Variables : NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_BASE_PATH, NEXT_PUBLIC_FORM_ENDPOINT (figées au build),
#               DOKPLOY_URL (ex. https://dokploy.mondomaine.fr), DOKPLOY_COMPOSE_ID
#   Secret    : DOKPLOY_API_KEY (Dokploy → Settings → Profile → API/CLI)
# Sans DOKPLOY_COMPOSE_ID, l'image est construite et poussée, mais rien n'est redéployé.

name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux pushs rapprochés : seul le dernier est construit et déployé.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR exige un nom d'image en minuscules.
  IMAGE: ghcr.io/pierrebrodart/atelier404

jobs:
  image:
    name: Construire et pousser l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Les runners GitHub ont de la marge : plafond mémoire et workers de prérendu relevés.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://atelier404.fr' }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}
            NEXT_PUBLIC_FORM_ENDPOINT=${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
            BUILD_MEMORY_MB=4096
            NEXT_BUILD_CPUS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redéployer sur Dokploy
    needs: image
    if: ${{ vars.DOKPLOY_COMPOSE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}"
