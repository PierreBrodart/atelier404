# Déploiement Dokploy (ou tout hôte Docker) à partir de l'image construite par la CI.
#
# Le serveur ne construit RIEN : `next build` y épuise la mémoire et le déploiement plante.
# L'image est construite par GitHub Actions (.github/workflows/deploy.yml), poussée sur
# GHCR, puis la CI demande à Dokploy de redéployer : Dokploy ne fait que la télécharger.
#
# Dans Dokploy : application de type "Docker Compose" pointée sur ce fichier, déploiement
# automatique au push DÉSACTIVÉ (c'est la CI qui déclenche, une fois l'image prête), domaine
# attaché sur le port interne 3000. Les variables NEXT_PUBLIC_* se règlent côté GitHub
# (variables du dépôt), pas ici : elles sont figées dans l'image au build.
#
# Construire l'image soi-même, en local : voir docker-compose.build.yml.
#
# ⚠️ Un seul réplica : le jeu Undercover garde son état en mémoire dans le processus
# (voir TECHNICAL.md §9 et §12). Ne pas activer de scaling horizontal sur ce service.

services:
  atelier404:
    image: ${ATELIER404_IMAGE:-ghcr.io/pierrebrodart/atelier404:latest}
    # Toujours retélécharger le tag au déploiement (sinon `latest` resterait l'ancienne image en cache).
    pull_policy: always
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      # Segment secret de l'éditeur Kahoot (/kahoot/<ce-segment>) : variable d'exécution, pas
      # un build arg NEXT_PUBLIC_ (elle ne doit jamais atterrir dans le JS envoyé au
      # navigateur). Définissez une vraie valeur dans l'environnement de Dokploy — jamais
      # commitée. Voir TECHNICAL.md §13.
      KAHOOT_EDITOR_SLUG: ${KAHOOT_EDITOR_SLUG:-atelier-prive-9f3k2q}
    volumes:
      # Un fichier JSON par Kahoot (voir TECHNICAL.md §13) : sans ce volume, tout est perdu au
      # prochain redéploiement.
      - kahoot_data:/app/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

volumes:
  kahoot_data:
